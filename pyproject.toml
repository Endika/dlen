[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dlen"
version = "0.3.0"
description = "Check how long your functions and classes are, counting the code you actually read and not your docstrings or blank lines"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Endika Iglesias", email = "endika2@gmail.com" }]
keywords = ["linter", "refactoring", "code-quality", "static-analysis", "complexity"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Endika/dlen"
Repository = "https://github.com/Endika/dlen"
Issues = "https://github.com/Endika/dlen/issues"
Changelog = "https://github.com/Endika/dlen/blob/main/CHANGELOG.md"

[project.scripts]
dlen = "dlen.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dlen"]
artifacts = ["src/dlen/py.typed"]

[tool.hatch.build.targets.sdist]
include = ["src/dlen", "tests", "README.md", "LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # import sorting
    "UP",        # pyupgrade
    "B",         # bugbear
    "SIM",       # simplify
    "C4",        # comprehensions
    "RET",       # returns
    "PTH",       # use pathlib
    "ARG",       # unused arguments
    "TID",       # tidy imports
    "RUF",
]

[tool.mypy]
# No python_version pin: it only ever makes mypy parse modern stubs with older rules.
# The 3.10 floor is proven by the CI test matrix instead.
strict = true
warn_unreachable = true
show_error_codes = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"

[tool.coverage.run]
source = ["dlen"]

[tool.coverage.report]
exclude_also = ["if __name__ == .__main__.:"]
